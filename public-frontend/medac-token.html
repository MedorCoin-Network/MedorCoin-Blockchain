<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medac Token — Advanced Asset Ecosystem</title>
  
  <!-- Core Dependencies: Ethers.js CDN Injection -->
  <script src="https://cloudflare.com"></script>
  
  <style>
    @import url('https://googleapis.com');

    :root {
      --bg-main: #0b111e;
      --candy-blue: #2563eb;
      --candy-pink: #db2777;
      --glass-base: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.12);
      --candy-glow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      --candy-glow-pink: 0 8px 32px 0 rgba(219, 39, 119, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: radial-gradient(circle at 50% 50%, #1e293b 0%, var(--bg-main) 100%);
      color: #f1f5f9;
      font-family: 'Quicksand', sans-serif;
      overflow-x: hidden;
      padding-bottom: 60px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* 3D Glossy Candy Glassmorphism Panels */
    .glossy-card {
      background: var(--glass-base);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: var(--candy-glow), inset 0 2px 4px rgba(255,255,255,0.2);
      position: relative;
      overflow: hidden;
    }
    
    .glossy-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 50%;
      background: linear-gradient(to bottom, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 100%);
      pointer-events: none;
    }

    .candy-btn {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-radius: 16px;
      border: none;
      color: #fff;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.4), inset 0 -4px 4px rgba(0,0,0,0.3);
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }

    .candy-btn-blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .candy-btn-pink { background: linear-gradient(135deg, #ec4899, #be185d); }

    .candy-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(59,130,246,0.4), inset 0 2px 4px rgba(255,255,255,0.6);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(11, 17, 30, 0.7);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0; z-index: 100;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Fredoka', sans-serif;
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-ball {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      box-shadow: inset -4px -4px 8px rgba(0,0,0,0.5), inset 4px 4px 8px rgba(255,255,255,0.6), 0 4px 12px rgba(236,72,153,0.4);
    }

    .nav-links { display: flex; gap: 24px; align-items: center; }
    .dropdown { position: relative; display: inline-block; }
    .dropbtn {
      background: none; border: none; color: #cbd5e1;
      font-size: 16px; font-weight: 700; cursor: pointer;
      font-family: inherit;
    }

    .dropdown-content {
      display: none; position: absolute; background-color: #1e293b;
      min-width: 200px; box-shadow: 0px 8px 24px rgba(0,0,0,0.6);
      border-radius: 14px; border: 1px solid var(--glass-border);
      z-index: 1; top: 100%; left: 0; overflow: hidden;
    }

    .dropdown-content a {
      color: #e2e8f0; padding: 14px 16px; text-decoration: none;
      display: block; font-weight: 600; font-size: 14px;
    }

    .dropdown-content a:hover { background-color: #334155; color: #fff; }
    .dropdown:hover .dropdown-content { display: block; }

    .hero-container {
      max-width: 1400px; margin: 30px auto; padding: 0 20px;
      display: grid; grid-template-columns: 1fr 480px; gap: 30px;
    }

    .left-column, .right-column { display: flex; flex-direction: column; gap: 30px; }

    /* Visual Background Layout Grid Elements */
    .artwork-banner {
      height: 240px; display: grid; grid-template-columns: 2fr 1fr; gap: 20px;
    }

    .ai-characters {
      background: linear-gradient(rgba(11,17,30,0.4), rgba(11,17,30,0.5)), url('https://unsplash.com') center/cover no-repeat;
      border-radius: 24px; border: 1px solid var(--glass-border);
      display: flex; align-items: flex-end; padding: 24px;
      box-shadow: inset 0 0 50px rgba(0,0,0,0.7), var(--candy-glow);
    }

    .pebble-philosophy {
      background: linear-gradient(rgba(11,17,30,0.4), rgba(11,17,30,0.6)), url('https://unsplash.com') center/cover no-repeat;
      border-radius: 24px; border: 1px solid var(--glass-border);
      display: flex; flex-direction: column; justify-content: flex-end; padding: 24px;
      box-shadow: inset 0 0 50px rgba(0,0,0,0.7), var(--candy-glow-pink);
    }

    .banner-title { font-family: 'Fredoka', sans-serif; font-size: 22px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .banner-desc { font-size: 13px; color: #cbd5e1; text-shadow: 0 1px 2px rgba(0,0,0,0.8); margin-top: 6px; font-weight: 500; line-height: 1.4; }

    .aim-card {
      background: linear-gradient(135deg, rgba(37,99,235,0.12), rgba(219,39,119,0.12));
      border: 1px solid rgba(255,255,255,0.15); padding: 26px; border-radius: 24px;
    }

    .trade-card { padding: 26px; }
    
    .tab-header {
      display: grid; grid-template-columns: repeat(4, 1fr);
      background: rgba(0, 0, 0, 0.3); border-radius: 16px; padding: 6px; margin-bottom: 24px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .tab-btn {
      background: none; border: none; color: #94a3b8; padding: 12px; font-weight: 700; font-size: 14px;
      cursor: pointer; border-radius: 12px; font-family: inherit;
    }

    .tab-btn.active {
      background: var(--candy-blue); color: #fff;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), 0 4px 12px rgba(37,99,235,0.3);
    }

    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; color: #cbd5e1; }

    .input-wrapper {
      display: flex; background: rgba(0,0,0,0.35); border: 1px solid var(--glass-border);
      border-radius: 16px; padding: 10px 14px; align-items: center;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }

    .input-wrapper input {
      flex: 1; background: none; border: none; color: #fff; font-size: 22px; font-weight: 700;
      outline: none; width: 100%; font-family: 'Fredoka', sans-serif;
    }

    .asset-select {
      background: #1e293b; border: 1px solid var(--glass-border); color: #fff;
      font-weight: 700; padding: 8px 12px; border-radius: 12px; cursor: pointer; outline: none;
    }

    .card-secure-pane {
      background: rgba(0,0,0,0.25); border: 1px dashed rgba(255,255,255,0.2);
      border-radius: 18px; padding: 18px; margin-bottom: 18px;
    }

    .secure-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #10b981; font-weight: 700; margin-bottom: 14px; text-transform: uppercase; }
    .summary-row { display: flex; justify-content: space-between; font-size: 14px; color: #94a3b8; font-weight: 600; margin-top: 10px; }
    .chart-container { padding: 26px; min-height: 360px; }
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

    .news-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 30px; }
    .news-card { padding: 22px; display: flex; flex-direction: column; gap: 10px; }
    .news-tag { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #f43f5e; }

    /* FAQ Transitions */
    .faq-section { padding: 30px; margin-bottom: 40px; }
    .faq-item { border-bottom: 1px solid var(--glass-border); padding: 18px 0; cursor: pointer; }
    .faq-question { font-size: 16px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; user-select: none; }
    .faq-icon { font-size: 18px; font-weight: 700; transition: transform 0.2s ease; color: var(--candy-pink); }
    .faq-answer { font-size: 14px; color: #94a3b8; font-weight: 600; margin-top: 0; max-height: 0; overflow: hidden; line-height: 1.6; transition: max-height 0.3s ease, margin-top 0.3s ease; }
    .faq-item.active .faq-icon { transform: rotate(45deg); }
    .faq-item.active .faq-answer { margin-top: 12px; max-height: 200px; }
  </style>
</head>
