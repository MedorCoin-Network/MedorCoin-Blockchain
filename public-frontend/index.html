<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Embed Swap Interface</title>
  <script src="https://cloudflare.com"></script>
  <style>
    :root {
      --gold: #f3e5ab; 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, Segoe UI, sans-serif;
      background: #121b2d;
      color: #ffffff;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .swap-box {
      background: var(--gold);
      color: #000000;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      border-radius: 20px;
      border: 1px solid rgba(0,0,0,0.1);
    }
    .swap-title {
      font-weight: 800;
      font-size: 22px;
      margin-bottom: 20px;
      text-align: center;
      color: #000000;
    }
    .input-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #1a1a1a;
    }
    input {
      width: 100%;
      padding: 14px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(0,0,0,0.15);
      border-radius: 10px;
      color: #000000;
      font-size: 16px;
      font-weight: 600;
      outline: none;
    }
    input:focus {
      background: #ffffff;
      border-color: #000000;
    }
    input[readonly] {
      background: rgba(255, 255, 255, 0.4);
      cursor: default;
    }
    .rate-info {
      font-size: 12px;
      font-weight: 600;
      color: #333333;
      margin: 10px 0 20px;
      display: flex;
      justify-content: space-between;
    }
    .btn {
      width: 100%;
      padding: 16px;
      background: #000000;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #222222;
    }
    .btn:disabled {
      background: #aaaaaa;
      color: #666666;
      cursor: not-allowed;
    }
    .feedback {
      font-size: 12px;
      text-align: center;
      margin-top: 12px;
      color: #444444;
      font-weight: 500;
    }
  </style>
</head>
<body>

<!-- REPAIRED GRID FRAME: Guarantees the swap card renders on your page -->
  <div class="grid" aria-label="Portal tiles">
    
    <!-- Blockchain Card -->
    <a class="tile bg-teal" href="blockchain.html" style="min-height:96px;">
      <b>Blockchain</b>
      <span class="muted">On-chain tools & explorer</span>
    </a>

    <!-- Rent/Buy API Card -->
    <a class="tile" href="combined_api_portal.html" style="background:#87CEEB;color:#1f1f1f;min-height:96px;">
      <b>Rent/Buy API</b>
      <span class="muted" style="color:#1f1f1f;opacity:.8">API access</span>
    </a>

    <!-- For Miners Card -->
    <a class="tile" href="miners.html" style="background:#FFD6A3;color:#333;min-height:96px;">
      <b>For Miners</b>
      <span class="muted">Start mining</span>
    </a>

    <!-- For Developers Card -->
    <a class="tile" href="developers.html" style="background:#87CEEB;color:#333;min-height:96px;">
      <b>For Developers</b>
      <span class="muted">Docs & SDKs</span>
    </a>

    <!-- Crypto Trading Card -->
    <a class="tile" href="trading.html" style="background:#3F3F3F;color:#FDE68A;min-height:96px;">
      <b>Crypto Trading</b>
      <span class="muted">Markets & tools</span>
    </a>

    <!-- Courses Card -->
    <a class="tile" href="courses.html" style="background:#0B3D91;color:#fff;min-height:96px;">
      <b>Courses</b>
      <span class="muted">Guides</span>
    </a>

    <!-- Chatroom Card -->
    <a class="tile" href="swap.html" style="background:#fff;border:1px solid var(--border);min-height:96px;">
      <b>Buy MedorCoin</b>
      <span class="muted">Chat & support</span>
    </a>

    <!-- Crypto Whales Card -->
    <a class="tile" href="whales.html" style="background:#fff;border:1px solid var(--border);min-height:96px;">
      <b>Crypto Whales</b>
      <span class="muted">Large flows</span>
    </a>

    <!-- INSERTED HERE: Swap Interface Card breaking the grid before the "MORE" tile -->
    <div class="swap-embedded-card" style="grid-column: 1 / -1; width: 100%; display: flex; justify-content: center; margin: 20px 0; min-height: 580px;">
      <iframe 
        src="swap.html" 
        style="width: 100%; max-width: 480px; height: 580px; border: 1px solid var(--border); border-radius: 24px; background: #121b2d; box-shadow: 0 10px 30px rgba(0,0,0,0.5);"
        scrolling="no" 
        loading="lazy" 
        title="MedorCoin Smart Contract Core Swap Interface">
      </iframe>
    </div>

    <!-- MORE Card (Placed strictly after the swap card frame) -->
    <a class="tile" href="more.html" style="background:#1e293b;color:#fff;min-height:96px;display:flex;align-items:center;justify-content:center;">
      <b style="font-size:18px;">MORE</b>
    </a>

  </div>
  
<script>
  const MEDOR_ADDRESS = "0xd37A0F3F4E0E9F79b5eE2EC953EAD81112424b94";
  const WBTC_ADDRESS  = "0x2260FAC5E5542a773Aa44BCfeDf7C193bc2C5996";

  const MEDOR_ABI = [
    "function isSwapActive() view returns (bool)",
    "function tokensPerWBTC() view returns (uint256)",
    "function swapWBTCForMedor(uint256 wbtcAmount) external"
  ];

  const WBTC_ABI = [
    "function allowance(address owner, address spender) view returns (uint256)",
    "function approve(address spender, uint256 value) external returns (bool)"
  ];

  let provider, signer, medorContract, wbtcContract;
  let walletConnected = false;
  let userAddress = "";
  let systemTokensPerWbtc = 0n;

  async function connectWallet() {
    if (!window.ethereum) {
      alert("No Web3 provider recognized. Please install MetaMask or Rabby.");
      return;
    }
    try {
      provider = new ethers.BrowserProvider(window.ethereum);
      const accounts = await provider.send("eth_requestAccounts", []);
      signer = await provider.getSigner();
      userAddress = accounts[0];
      medorContract = new ethers.Contract(MEDOR_ADDRESS, MEDOR_ABI, signer);
      wbtcContract  = new ethers.Contract(WBTC_ADDRESS, WBTC_ABI, signer);
      walletConnected = true;
      await syncContractParameters();
    } catch (err) {
      console.error("Connection cancelled:", err);
    }
  }

  async function syncContractParameters() {
    if (!medorContract) return;
    try {
      const active = await medorContract.isSwapActive();
      const rate = await medorContract.tokensPerWBTC();
      systemTokensPerWbtc = BigInt(rate);
      document.getElementById("rateDisplay").innerText = "1 WBTC = " + systemTokensPerWbtc.toString() + " MEDOR";
      const btn = document.getElementById("actionButton");
      const feedback = document.getElementById("feedbackText");
      if (!active) {
        btn.setAttribute("disabled", "true");
        btn.innerText = "Swap Closed";
        feedback.innerText = "Pre-launch swap pool parameters are currently set to closed by the administrator.";
      } else {
        btn.removeAttribute("disabled");
        btn.innerText = "Execute Purchase";
        feedback.innerText = "Clears token ledger validation layers instantly.";
      }
    } catch (err) {
      console.error("State sync tracking issue:", err);
      document.getElementById("rateDisplay").innerText = "1 WBTC = 2,050 MEDOR";
      systemTokensPerWbtc = 2050n;
    }
  }

  function calculateOutput() {
    const inputAmount = document.getElementById("wbtcInput").value.trim();
    const outputField = document.getElementById("medorOutput");
    if (!inputAmount || isNaN(inputAmount) || systemTokensPerWbtc === 0n || parseFloat(inputAmount) <= 0) {
      outputField.value = "0.0000";
      return;
    }
    const outputTokens = parseFloat(inputAmount) * Number(systemTokensPerWbtc);
    outputField.value = outputTokens.toLocaleString(undefined, { minimumFractionDigits: 4 }) + " MEDOR";
  }

  async function handleTradePipeline() {
    if (!walletConnected) {
      await connectWallet();
      return;
    }
    const inputVal = document.getElementById("wbtcInput").value.trim();
    const feedback = document.getElementById("feedbackText");
    const btn = document.getElementById("actionButton");
    if (!inputVal || isNaN(inputVal) || parseFloat(inputVal) <= 0) {
      alert("Please provide a valid spending input value.");
      return;
    }
    try {
      btn.setAttribute("disabled", "true");
      const satoshiUnits = BigInt(Math.round(parseFloat(inputVal) * 10**8));
      feedback.innerText = "Verifying existing WBTC authorization allowance...";
      const currentAllowance = await wbtcContract.allowance(userAddress, MEDOR_ADDRESS);
      if (currentAllowance < satoshiUnits) {
        feedback.innerText = "Step 1 of 2: Confirm WBTC allowance in your extension wallet...";
        const txApprove = await wbtcContract.approve(MEDOR_ADDRESS, satoshiUnits);
        await txApprove.wait();
        feedback.innerText = "Allowance cleared! Initializing swap finalization...";
      }
      feedback.innerText = "Step 2 of 2: Executing on-chain swap transaction...";
      const txSwap = await medorContract.swapWBTCForMedor(satoshiUnits);
      await txSwap.wait();
      feedback.innerText = "Swap complete! Medor tokens transferred successfully.";
      document.getElementById("wbtcInput").value = "";
      document.getElementById("medorOutput").value = "0.0000";
    } catch (err) {
      console.error("Trade pipeline error:", err);
      feedback.innerText = "Transaction failed or was canceled.";
    } finally {
      btn.removeAttribute("disabled");
      btn.innerText = "Execute Purchase";
    }
  }
</script>
</body>
</html>
